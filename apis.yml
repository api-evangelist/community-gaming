name: Community Gaming
description: 'Community Gaming is a web3 esports and gaming platform where players earn cryptocurrency
  rewards by competing in tournaments and completing quests. Players link a Sequence wallet, collect keys
  from quests and matches to open loot boxes and giveaway tickets, and enter prize draws paid out in USDC.
  The platform also serves tournament organizers with hosting tools, sponsorships, and grants. Backed by
  Multicoin Capital, it publishes a public knowledge center for players and organizers but does not
  currently document a public developer API, OpenAPI specification, or SDKs.'
